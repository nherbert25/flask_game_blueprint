[project]
name = "flask-game-blueprint"
version = "0.1.0"
description = "Flask game blueprint"
authors = [
    {name = "Nate Herbert"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask (>=3.1.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
flask-testing = "^0.8.1"

