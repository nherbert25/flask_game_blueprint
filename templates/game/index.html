<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Card Game Prototype</title>
  <link rel="stylesheet" href="{{ url_for('flask_game_bp.static', filename='css/styles.css') }}">
</head>
<body>
  <h1>Welcome to the Game</h1>

  <div id="game-log"></div>

  <button id="start-btn">Start</button>
  <button id="attack-btn">Attack</button>

  <div id="game-container"></div>

  <h1>Card Game Prototype</h1>

  <div class="card-container">
    <div class="card attack" draggable="true" data-type="attack">Attack</div>
    <div class="card defense" draggable="true" data-type="defense">Defense</div>
  </div>

  <div class="drop-zone" id="activation-zone">
    Drop here to activate
  </div>

  <div id="stats-sidebar">
    <h3>Player Stats</h3>
    <p>Name: <span id="player-name-display">-</span></p>
    <p>HP: <span id="player-hp">-</span></p>
    <p>Attack: <span id="player-attack">-</span></p>
    <p>Defense: <span id="player-defense">-</span></p>
</div>

  <div id="log"></div>

  <script src="{{ url_for('flask_game_bp.static', filename='js/scripts.js') }}"></script>
</body>
</html>
